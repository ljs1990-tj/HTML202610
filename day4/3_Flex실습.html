<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #e8e3e3;
        }
        #container {
            width: 100%;
            max-width: 1000px;
            margin : 20px auto;
        }
        #header {
            background-color: rgb(251, 249, 249);
            padding : 20px;
            display : flex;
            justify-content: space-between;
            border-radius: 5px;
            box-shadow: 2px 2px 2px #ccc;
        }
        #logo {
            font-size: 30px;
            font-weight: bold;
        }
        #menu {
            display: flex;
        }
        #menu a {
            text-decoration: none;
            color : black;
            background-color: #eee;
            padding : 10px 20px;
            border-radius: 5px;
            margin-left : 10px;
        }
        #menu a:hover {
            background-color: #ccc;
        }

        .card-container {
            padding: 30px 10px;
            display: flex;
            flex-wrap: wrap; /* 다음줄 자동 넘김 */
            justify-content: center; 
            gap: 20px;
        }
        .card {
            background-color: white;
            width: 270px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column; /* 세로 배치 */
        }

        img {
            width: 200px;
            height: 200px;
            margin: 20px;
            border-radius: 30px;
            border: 2px solid #ccc;
        }

        .card-title {
            font-size: 18px;
            margin-top: 0;
        }

        .card-desc {
            color: #666;
            font-size: 14px;
            height: 70px;
        }

        .buy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .buy-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="logo">굿쇼핑몰</div>
            <div id="menu">
                <a href="javascript:;">장바구니</a>
                <a href="javascript:;">마이페이지</a>
                <a href="javascript:;">로그아웃</a>
            </div>
        </div>

        <div class="card-container">
            <div class="card">
                <img src="../images/ryan1.jpg">
                <h2 class="card-title">상품 A</h2>
                <p class="card-desc">이 상품은 아주 훌륭합니다. 설명할 필요가 없어요</p>
                <button class="buy-btn">구매하기</button>
            </div>
            <div class="card">
                <img src="../images/ryan2.jpg">
                <h2 class="card-title">상품 B</h2>
                <p class="card-desc">이 상품은 기가 막힙니다. 꼭 구매하세요. 가성비 좋고 어쩌구 저쩌구 그냥 좋습니다. ㅎㅎㅎ</p>
                <button class="buy-btn">구매하기</button>
            </div>
            <div class="card">
                <img src="../images/ryan3.jpg">
                <h2 class="card-title">상품 C</h2>
                <p class="card-desc">최고의 가성비.</p>
                <button class="buy-btn">구매하기</button>
            </div>
        </div>
    </div>
</body>
</html>
