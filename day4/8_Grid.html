<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display : grid;
            grid-template-columns: repeat(3, 1fr);
            /* grid-template-rows: 100px 200px; */
            grid-template-rows: repeat(4, 100px);
            grid-template-areas: 
            "b-box b-box b-box"
            "o-box g-box g-box"
            "o-box p-box p-box";

        }
        .box {
            border: 2px solid black;
            text-align: center;
            padding: 10px;
            font-size: 15px;
        }

        .blue-box {
            background-color: blue;
            grid-area: b-box;
        }
        .orange-box {
            background-color: orange;
           grid-area: o-box;
        }
        .green-box {
            background-color: green;
            grid-area: g-box;
        }
        .purple-box {
            background-color: purple;
            grid-area: p-box;
        }
        

    </style>
</head>
<body>
    <div id="container">
        <div class="box blue-box">box1</div>
        <div class="box orange-box">box2</div>
        <div class="box green-box">box3</div>
        <div class="box purple-box">box4</div>
    </div>
    
</body>
</html>
