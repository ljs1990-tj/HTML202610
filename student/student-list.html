<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 2px solid black;
            border-collapse: collapse;
            padding : 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div>
            <table>
                <tr>
                    <th>학번</th>
                    <th>이름</th>
                    <th>학과</th>
                    <th>학년</th>
                    <th>수정</th>
                    <th>삭제</th>
                </tr>
                <tr v-for="item in list">
                    <td>{{item.STU_NO}}</td>
                    <td><a href="javascript:;" @click="fnView(item.STU_NO)">{{item.STU_NAME}}</a></td>
                    <td>{{item.STU_DEPT}}</td>
                    <td>{{item.STU_GRADE}}</td>
                    <td><button @click="fnEdit(item.STU_NO)">수정</button></td>
                    <td><button @click="fnRemove(item.STU_NO)">삭제</button></td>
                </tr>
            </table>
        </div>
        <div>
            <a href="student-add.html"><button>학생추가</button></a>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                list : []
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnList : function () {
                let self = this;
                $.ajax({
                    url: "http://localhost:3000/list",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {
                        console.log(data);
                        self.list = data.list;
                    }
                });
            },
            fnRemove : function(stuNo){
                let self = this;
                if(!confirm("정말 삭제??")){
                    return;
                }

                $.ajax({
                    url: "http://localhost:3000/delete",
                    dataType: "json",
                    type: "GET",
                    data: {stuNo : stuNo},
                    success: function (data) {
                        console.log(data);
                        alert("삭제되었습니다!");
                        self.fnList();
                    }
                });
            },
            fnEdit : function(stuNo){
                location.href = `student-edit.html?stuNo=${stuNo}`;
            },
            fnView : function(stuNo){
                location.href = `student-view.html?stuNo=${stuNo}`;
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self = this;
            self.fnList();
        }
    });

    app.mount('#app');
</script>
