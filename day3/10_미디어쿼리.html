<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 1150px;
            margin : 50px auto;
        }
        .card{
            width: 550px;
            height: 250px;
            margin : 10px;
            box-sizing: border-box;
            border : 2px solid black;
            background-color: beige;
            float: left;
            position: relative;

        }
            
        img {
            width: 270px;
            height: 245px;
        }
        .word{
            position: absolute;
            left : 320px;
            top : 60px;
            text-align: center;
        }
       
        
    </style>
</head>
<body>
    <div id="container">
        <div class="card">
            <img src="../images/img3.jpg">
            <div class="word">
                <h2>아유... 하기 싫어</h2>
                <h3>- 거성 박명수 - </h3>
            </div>
        </div>
        <div class="card">
            <img src="../images/img4.jpg">
            <div class="word">
                <h2>그냥 놀고 싶다</h2>
                <h3>- 거성 박명수 - </h3>
            </div>
        </div>
    </div>
</body>
</html>
