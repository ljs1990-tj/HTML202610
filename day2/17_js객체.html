<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 onclick="fnChange()" style="color : orange; font-style: italic; cursor: pointer;" id="txt">JAVASCRIPT 재밌다~~~~~~</h1>
</body>
</html>
<script>
    function fnChange(){
        let obj = document.querySelector("#txt");
        if(obj.style.color == "orange"){
            obj.style.color = "blue";
            obj.style.fontStyle = "normal";
        } else {
            obj.style.color = "orange";
            obj.style.fontStyle = "italic";
        }
    }

</script>
