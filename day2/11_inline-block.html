<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {margin : 5px;}
        .box1 {
            width: 50px;
            height: 50px;
            background-color: aqua;
            border : 1px solid black;
            /* display: block; 디폴트 */
            display: inline-block;
        }
        .box2 {
            width: 50px;
            height: 50px;
            background-color: beige;
            border : 1px solid black;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- inline-block은 inline처럼 한줄에 나열되면서 block 처럼 크기를 마음대로 변경 할 수 있다. -->
    <div class="box1">div 1</div>
    <div class="box2">div 2</div>
    <hr>
    <span class="box1">span 1</span>
    <span>span 2</span>
</body>
</html>
