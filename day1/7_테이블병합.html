<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, th, td {
            border : 2px solid black; /* 2픽셀 크기의 검은색 선(solid) */
            border-collapse: collapse; /* 겹치는 선 하나로 */
            padding : 5px 20px; /* 상하 5px, 좌우 20px 여백*/
            text-align: center; /* 가운데 정렬 */
        }
        th {
            background-color: beige;
        }
        
    </style>

</head>
<body>
    <table>
        <tr>
            <td colspan="2">1</td>
            
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td rowspan="2">5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
           
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
    </table>
</body>
</html>
